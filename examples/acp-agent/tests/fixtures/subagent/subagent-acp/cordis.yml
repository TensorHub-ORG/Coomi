# Test-only composition: the ACP subagent backend on the real Loader/app path.
# The scripted model delegates once; the scripted mock ACP child (MOCK_ECHO_CWD)
# echoes its process cwd and announced session cwd, so parent-session cwd
# inheritance is asserted keylessly end to end. `cwd` is deliberately omitted —
# the inheritance branch under test. The child command path is machine-absolute,
# so the driving e2e supplies it via COOMI_TEST_MOCK_ACP_SERVER.
- id: mock-llm
  name: './mock-delegating-llm.ts'

- id: subagent
  name: '@coomi/coomi-subagent'

# The out-of-process ACP backend spawns its child through the subprocess seam.
- id: subprocess
  name: '@coomi/coomi-subprocess-local'

- id: subagent-acp
  name: '@coomi/coomi-subagent-acp'
  config:
    providerName: acp
    command: !!js process.execPath
    args:
      - !!js process.env.COOMI_TEST_MOCK_ACP_SERVER
    permission: reject
    env:
      MOCK_ECHO_CWD: '1'

- id: tool-subagent
  name: '@coomi/coomi-tool-subagent'
  config:
    provider: acp
    toolName: subagent
    # ACP advertises no depthLimit: the child harness owns its own recursion
    # budget, so the local numeric default cannot apply here.
    maxDepth: 'provider-managed'

- id: agent-spine
  name: '@coomi/coomi-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()
    persona: 'Test ACP subagent cwd inheritance.'
    workspaceContext: false

- id: persistence
  name: '@coomi/coomi-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@coomi/coomi-session-checkpoint-policy'
