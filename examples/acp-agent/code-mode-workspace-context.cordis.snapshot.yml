# Keyless replay counterpart of code-mode-workspace-context.cordis.yml. It adds
# Code Mode to the default filesystem suite and swaps in replay.
- id: base
  name: '@coomi/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@coomi/coomi-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@coomi/coomi-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.COOMI_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: 'none'
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: code
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@coomi/coomi-code-runtime-worker-thread'
          - id: llm-replay
            name: '@coomi/coomi-llm-replay'
