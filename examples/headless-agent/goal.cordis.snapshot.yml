# Replay counterpart to goal.cordis.yml. It includes cordis.yml directly because
# a config patch cannot target an entry behind a nested include, then restates
# the goal overlay while replacing the live model with keyless replay.
- id: base
  name: '@coomi/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@coomi/coomi-llm-deepseek'
        disabled: true
      - insert:
          - id: goal
            name: '@coomi/coomi-goal'
          - id: tool-goal
            name: '@coomi/coomi-tool-goal'
          - id: llm-replay
            name: '@coomi/coomi-llm-replay'
