appId: com.coomi.desktop
productName: Coomi
copyright: Copyright © 2026 Coomi
directories:
  output: release
files:
  - src/**
  - resources/**
asarUnpack:
  - node_modules/node/bin/**
  - node_modules/node/node_modules/node-win-x64/bin/**
  - node_modules/pnpm/**
win:
  target:
    - nsis
  icon: resources/coomi.ico
  artifactName: Coomi-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Coomi
  installerIcon: resources/coomi.ico
  uninstallerIcon: resources/coomi.ico
