[package]
name = "coomi-desktop"
# 版本单一来源：tauri.conf.json 不再写 version，构建时从这里继承；
# 壳的 app_version 与「检查更新」都用 package_info()，因此这里就是唯一真相。
version = "1.0.2"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread", "sync"] }
anyhow = "1"
# 更新包摘要校验（壳侧流式算 sha256；引擎那些 crate 里没带这个依赖）
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
